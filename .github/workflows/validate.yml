name: Validate

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install OpenCode runtime dependencies
        run: npm ci --prefix .opencode

      - name: Prepare canonical workspace artifacts
        run: |
          if [ ! -f meta-agents.yaml ]; then
            cp meta-agents.example.yaml meta-agents.yaml
          fi
          npm run sync:meta

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Run runtime contract tests
        run: npm run test:contract

      - name: Run plugin system tests
        run: npm run test:plugins

      - name: Run diagnostics and platform reliability tests
        run: npm run test:diagnostics

      - name: Validate canonical config
        run: npm run validate:config

      - name: Run expertise integration tests
        run: node --test tests/expertise/*.test.mjs

      - name: Validate canonical sync drift
        run: npm run check:meta-sync

  audit-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Isolated audit regression tests (no model calls)
        run: npm run test:audit

  webui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci --prefix webui
      - run: npm run typecheck --prefix webui
      - run: npm run build --prefix webui
      - run: node webui/server/smoke.mjs
